l_english:
  EAH_endgame.2.t:0 "The Inquisition Stirs"
  EAH_endgame.2.desc:0 "In your quest to find an Antediluvian you've spent sack upon sack of gold and cashed every favor your name could buy to moderate success: Now your contacts have started drying up. Kindred that would jump at the chance to trade knowledge for coin have started to recede into the darkest depths they could find. The only information that reaches you now is hushed whispers of emboldened hunters, common men sharpening stakes and a bubbling fury within the Holy See that is about to boil over. This door to the Antediluvians has shut, but surely another chance will present itself."
  EAH_endgame.2.a:0 "I'll bide my time..."